name: Node ownership native acceptance

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Course source structure
        run: ./verify-course-source.sh
      - name: Ordinary and sanitized single-owner collections
        run: python3 tests/verify-node-ownership.py --compiler "${{ matrix.compiler }}"
